services: 
  app:
    image: anuenergy/demo-python:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    volumes:
      - ./app:/app
    environment:
      - ENV_VAR_NAME=value
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
